[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Unificar en la variante sin www: www.com.ar → com.ar (301 permanente).
[[redirects]]
  from = "https://www.camcaserviciosintegrales.com.ar/*"
  to = "https://camcaserviciosintegrales.com.ar/:splat"
  status = 301
  force = true

# Cabeceras de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
