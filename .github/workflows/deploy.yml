name: Deploy a Hostinger

# Se ejecuta en cada push a la rama principal
on:
  push:
    branches: [main]
  # Permite lanzarlo manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Buildear el sitio (genera dist/)
        run: npm run build

      - name: Subir dist/ a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Carpeta local que se sube (el build de Astro)
          local-dir: ./dist/
          # Carpeta en Hostinger donde vive el sitio.
          # En la mayoría de los planes es /public_html/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
