      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' })
            .then((reg) => {
              // NO se activa la version nueva sola: cambiar la app abajo de los
              // pies del chofer a mitad de jornada le hace perder el hilo. Se
              // activa cuando la pantalla dice que es seguro.
              window.__camcaSW = reg;
              if (reg.waiting) {
                window.dispatchEvent(new CustomEvent('camca:actualizacion-lista'));
              }
              reg.addEventListener('updatefound', () => {
                const nuevo = reg.installing;
                if (!nuevo) return;
                nuevo.addEventListener('statechange', () => {
                  if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('camca:actualizacion-lista'));
                  }
                });
              });
            })
            .catch((e) => console.warn('[camca] no se pudo registrar el service worker', e));
        });
      }
